<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17231f">
  <meta name="description" content="A private, mobile-first personal finance tracker with quick logging, budgets, accounts, installments and optional cloud sync.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <title>Pocket Ledger — Personal Finance</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#dashboard" aria-label="Pocket Ledger home">
        <span class="brand-mark">PL</span>
        <span><strong>Pocket Ledger</strong><small>Personal finance</small></span>
      </a>
      <div class="side-label">WORKSPACE</div>
      <nav class="side-nav" aria-label="Main navigation">
        <button data-view="dashboard" class="nav-item active"><span class="nav-icon">⌂</span> Overview</button>
        <button data-view="activity" class="nav-item"><span class="nav-icon">↕</span> Transactions</button>
        <button data-view="budgets" class="nav-item"><span class="nav-icon">▥</span> Budgets</button>
        <button data-view="accounts" class="nav-item"><span class="nav-icon">▤</span> Accounts</button>
        <button data-view="plans" class="nav-item"><span class="nav-icon">◷</span> Installments & loans</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="privacy-note"><span class="privacy-dot"></span><span><strong>Private by default</strong><small>Saved on this device</small></span></div>
        <button data-view="settings" class="nav-item settings-link"><span class="nav-icon">⚙</span> Settings & sync</button>
      </div>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <div class="mobile-brand"><span class="brand-mark">PL</span><strong>Pocket Ledger</strong></div>
        <div class="topbar-right">
          <span class="today-label" id="today-label"></span>
          <button class="button button-primary button-small" data-action="open-add">＋ <span>Quick add</span></button>
        </div>
      </header>
      <section class="page-content" id="page-content" aria-live="polite"></section>
    </main>
  </div>

  <nav class="mobile-nav" aria-label="Mobile navigation">
    <button data-view="dashboard" class="mobile-nav-item active"><span>⌂</span><small>Home</small></button>
    <button data-view="activity" class="mobile-nav-item"><span>↕</span><small>Activity</small></button>
    <button data-action="open-add" class="mobile-add"><span>＋</span></button>
    <button data-view="budgets" class="mobile-nav-item"><span>▥</span><small>Budget</small></button>
    <button data-action="open-more" class="mobile-nav-item"><span>⋯</span><small>More</small></button>
  </nav>

  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js" defer></script>
</body>
</html>
